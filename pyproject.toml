[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmy"
version = "0.1.0"
description = "Testbench for comparing organizational hierarchies of LLM agent swarms"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.4",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6",
    "matplotlib>=3.8",
    "dulwich>=0.22",  # git storage for wikis (pure Python, no git binary needed)
    "markdown-it-py>=3",  # Markdown rendering in the run explorer
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
swarmy = "swarmy.cli:main"

[tool.setuptools.packages.find]
include = ["swarmy*"]

[tool.setuptools.package-data]
"swarmy.ui" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
