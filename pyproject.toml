[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orgbench"
version = "0.1.0"
description = "Testbench for comparing organizational hierarchies of LLM agent swarms"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.4",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
orgbench = "orgbench.cli:main"

[tool.setuptools.packages.find]
include = ["orgbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
