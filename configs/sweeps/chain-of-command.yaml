# The grande-armée model ladder, flattened step by step at a fixed 8 mousquetaires.
# Depth 4 = full chain of command (connétable -> maréchal -> colonels -> capitaines -> mousquetaires);
# lower depths remove ranks from the middle, keeping the connétable on top.
# An Opus max-effort connétable is expensive, so $5 buys only one task across the four shapes.
# For more data per dollar, set the connétable's effort to high (or use --budget).
name: chain-of-command
budget_usd: 5.0
concurrency: 2
orgs:
  - generate:
      name: armee
      workers: 8
      depths: [1, 2, 3, 4]
      ladder:
        - {role: connétable, model: opus, effort: max}
        - {role: maréchal, model: opus, effort: medium}
        - {role: colonel, model: sonnet, effort: medium}
        - {role: capitaine, model: haiku}
      worker: {model: gpt-oss-120b}
tasks:
  - {family: mixed, params: {products: 6, cities: 4}, seeds: [1]}
