# Flatness pilot with a realistic model mix, at a fixed 4 workers:
#   lone Sonnet  vs  Sonnet field marshal -> 4 privates  vs  Sonnet field marshal -> Haiku captains -> privates
#   vs  Sonnet field marshal -> Haiku colonel -> Haiku captains -> privates
# 16 runs x ~$0.31 cap = $5.
name: pilot
budget_usd: 5.0
concurrency: 3
orgs:
  - generate:
      name: mix
      workers: 4
      depths: [1, 2, 3]
      include_solo: true
      ladder:
        - {model: sonnet, effort: low}   # titles default to military ranks by depth
        - {model: haiku}
      worker: {model: gpt-oss-120b}
tasks:
  - {family: qa, params: {kind: chain, hops: 3}, seeds: [1]}
  - {family: qa, params: {kind: aggregate, n: 6}, seeds: [1]}
  - {family: code, params: {n: 6, coupling: 0.3}, seeds: [1]}
  - {family: mixed, params: {products: 4, cities: 3}, seeds: [1]}
