# Endpoints and models. Org configs refer to models by these aliases.
#
# ENDPOINTS are where models are served. Built in (see swarmy/catalog.py):
#   anthropic   Anthropic Messages API                     key: ANTHROPIC_API_KEY
#   openrouter  OpenRouter (OpenAI-compatible)             key: OPENROUTER_API_KEY
#   openai      OpenAI                                     key: OPENAI_API_KEY
#   ollama      local Ollama at http://localhost:11434/v1  no key
#   mock        offline scripted models
# Add your own below (or in the designer: Models dialog, which writes configs/models.local.yaml).
# `type: openai` covers any server that speaks OpenAI chat completions with tool calling:
# vLLM, LM Studio, llama.cpp server, Together, Groq, Fireworks, Gemini's OpenAI endpoint, LiteLLM...
# `type: anthropic` with a base_url covers Anthropic-compatible gateways and proxies.
# Keys never go in this file: name the environment variable that holds them (put it in .env).
#
# MODELS: an alias -> endpoint + model id + price (USD per million tokens; used by the budget
# guard, so set it for paid endpoints). Or skip the catalog and write a model inline in any org
# config as <endpoint>:<model-id>, e.g. `ollama:qwen3:8b` or `openrouter:qwen/qwen3.7-flash`
# (OpenRouter prices are looked up live).
#
# Model fields: endpoint, model, price {input, output, cache_read, cache_write, long-context tier},
# max_concurrency, rpm, effort_levels, and for anthropic endpoints refusal_fallback / thinking.
# Prices: Anthropic list prices as of 2026-10; OpenRouter snapshot 2026-11-03 (`swarmy models check`).

endpoints:
  # vllm:
  #   type: openai
  #   base_url: http://gpu-box:8000/v1
  #   api_key_env: VLLM_API_KEY        # or omit / null if the server needs no key
  # lmstudio:
  #   type: openai
  #   base_url: http://localhost:1234/v1
  # gemini:
  #   type: openai
  #   base_url: https://generativelanguage.googleapis.com/v1beta/openai
  #   api_key_env: GEMINI_API_KEY
  #   effort_style: openai             # send reasoning effort as `reasoning_effort`
  # claude-gateway:
  #   type: anthropic
  #   base_url: https://llm-gateway.example.com/anthropic
  #   api_key_env: GATEWAY_KEY
  #   headers: {X-Team: research}
  # Other options: extra_body, tools_extra_body (merged into requests), max_tokens_param
  # (max_tokens | max_completion_tokens), live_pricing, max_concurrency, timeout_s.

models:
  # ---------------- Anthropic (direct API) ----------------
  opus:
    endpoint: anthropic
    model: claude-opus-5-5
    price: {input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00}
    max_concurrency: 6
    refusal_fallback: true

  sonnet:
    endpoint: anthropic
    model: claude-sonnet-5-5
    price: {input: 2.00, output: 10.00, cache_read: 0.20, cache_write: 2.50}
    max_concurrency: 8
    refusal_fallback: true

  haiku:
    endpoint: anthropic
    model: claude-haiku-5-5
    # $0.10/$0.50 for prompts up to 100K tokens, $0.50/$2.50 beyond.
    # Cache prices assume the standard 0.1x read / 1.25x write multipliers - verify on the pricing page.
    price:
      input: 0.10
      output: 0.50
      cache_read: 0.01
      cache_write: 0.125
      long_context_threshold: 100000
      long_input: 0.50
      long_output: 2.50
    max_concurrency: 12

  # ---------------- OpenRouter: free (rate-limited) ----------------
  # Free variants are rate-limited (roughly 20 req/min plus a daily cap that depends on
  # your account's credit balance - see OpenRouter's docs). Fine for smoke tests, but a
  # real sweep will hit the daily cap; use the cheap paid models below for sweeps.
  # Free endpoints may log prompts. Don't send anything sensitive.
  gemma-free:
    endpoint: openrouter
    model: google/gemma-4-31b-it:free
    price: {input: 0, output: 0}
    max_concurrency: 2
    rpm: 16

  nemotron-free:
    endpoint: openrouter
    model: nvidia/nemotron-3.5-lightning:free
    price: {input: 0, output: 0}
    max_concurrency: 2
    rpm: 16

  # ---------------- OpenRouter: cheap paid (tool-capable) ----------------
  gpt-oss-120b:
    endpoint: openrouter
    model: openai/gpt-oss-120b
    price: {input: 0.025, output: 0.092}
    max_concurrency: 16

  qwen-flash:
    endpoint: openrouter
    model: qwen/qwen3.7-flash
    price: {input: 0.03, output: 0.13}
    max_concurrency: 16

  deepseek-flash:
    endpoint: openrouter
    model: deepseek/deepseek-v4.1-flash
    price: {input: 0.045, output: 0.50}
    max_concurrency: 16

  # Claude through OpenRouter, for anyone who only has an OpenRouter key.
  haiku-or:
    endpoint: openrouter
    model: anthropic/claude-haiku-5.5
    price: {input: 0.10, output: 0.50}
    max_concurrency: 8

  # ---------------- OpenAI (direct) ----------------
  gpt-5-nano:
    endpoint: openai
    model: gpt-5-nano
    price: {input: 0.05, output: 0.40}

  # ---------------- Local (free; uncomment after `ollama pull <model>`) ----------------
  # qwen-local:
  #   endpoint: ollama
  #   model: qwen3:8b

  # ---------------- Offline ----------------
  mock:
    endpoint: mock
    model: mock
    price: {input: 0, output: 0}
