# Endpoints and models. Org configs refer to models by these aliases, or inline as
# <endpoint>:<model-id> (e.g. `ollama:qwen3:8b`). Built-in endpoints: anthropic, openrouter, openai,
# ollama, mock (see swarmy/catalog.py). Local additions go in the git-ignored models.local.yaml
# (the designer's Models dialog writes it). Keys never go here: name the environment variable.
#
# Prices are USD per million tokens and feed the budget guard: Anthropic list prices as of 2026-10,
# OpenRouter snapshot 2026-11-06 (`swarmy models check` compares them with live prices).

endpoints:
  # vllm:                              # any OpenAI-compatible server (vLLM, LM Studio, Gemini, LiteLLM...)
  #   type: openai
  #   base_url: http://gpu-box:8000/v1
  #   api_key_env: VLLM_API_KEY        # omit if the server needs no key
  #   effort_style: openai             # none | openai | openrouter: how to send reasoning effort
  # claude-gateway:                    # an Anthropic-compatible gateway
  #   type: anthropic
  #   base_url: https://llm-gateway.example.com/anthropic
  #   api_key_env: GATEWAY_KEY

models:
  # ---------------- Anthropic (direct API) ----------------
  opus:
    endpoint: anthropic
    model: claude-opus-5-5
    price: {input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00}
    max_concurrency: 6
    refusal_fallback: true

  sonnet:
    endpoint: anthropic
    model: claude-sonnet-5-5
    price: {input: 2.00, output: 10.00, cache_read: 0.20, cache_write: 2.50}
    max_concurrency: 8
    refusal_fallback: true

  haiku:
    endpoint: anthropic
    model: claude-haiku-5-5
    price:                             # higher rates above 100K prompt tokens
      input: 0.10
      output: 0.50
      cache_read: 0.01
      cache_write: 0.125
      long_context_threshold: 100000
      long_input: 0.50
      long_output: 2.50
    max_concurrency: 12

  # ---------------- OpenRouter: free ----------------
  # Rate-limited (~20 req/min plus a daily cap): fine for smoke tests, too slow for sweeps.
  # Free endpoints may log prompts.
  gemma-free:
    endpoint: openrouter
    model: google/gemma-4-31b-it:free
    price: {input: 0, output: 0}
    max_concurrency: 2
    rpm: 16

  nemotron-free:
    endpoint: openrouter
    model: nvidia/nemotron-3.5-lightning:free
    price: {input: 0, output: 0}
    max_concurrency: 2
    rpm: 16

  # ---------------- OpenRouter: cheap paid ----------------
  # If your account requires Zero Data Retention, only models with a ZDR provider work
  # (https://openrouter.ai/api/v1/endpoints/zdr). All below have one except qwen-flash.
  gpt-oss-120b:
    endpoint: openrouter
    model: openai/gpt-oss-120b
    price: {input: 0.012, output: 0.044}
    max_concurrency: 16

  glm-flash:
    endpoint: openrouter
    model: z-ai/glm-5.3-flash
    price: {input: 0.15, output: 0.50}   # list price; OpenRouter reports the actual cost
    max_concurrency: 16

  qwen-flash:
    endpoint: openrouter
    model: qwen/qwen3.7-flash
    price: {input: 0.03, output: 0.13}
    max_concurrency: 16

  deepseek-flash:
    endpoint: openrouter
    model: deepseek/deepseek-v4.1-flash
    price: {input: 0.051, output: 0.567}
    max_concurrency: 16

  # Claude through OpenRouter, for anyone who only has an OpenRouter key.
  haiku-or:
    endpoint: openrouter
    model: anthropic/claude-haiku-5.5
    price: {input: 0.10, output: 0.50}
    max_concurrency: 8

  # ---------------- OpenAI (direct) ----------------
  gpt-5-nano:
    endpoint: openai
    model: gpt-5-nano
    price: {input: 0.05, output: 0.40}

  # ---------------- Local (free; uncomment after `ollama pull <model>`) ----------------
  # qwen-local:
  #   endpoint: ollama
  #   model: qwen3:8b

  # ---------------- Offline ----------------
  mock:
    endpoint: mock
    model: mock
    price: {input: 0, output: 0}
