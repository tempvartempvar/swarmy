# Model catalog. Org configs refer to models by these aliases.
#
# You can also skip the catalog and write a model inline in any org config:
#   model: openrouter:qwen/qwen3.7-flash      (price fetched live from OpenRouter)
#   model: anthropic:claude-sonnet-5-5        (price copied from the matching entry below)
#
# Prices are USD per million tokens. Anthropic list prices as of 2026-10; OpenRouter prices
# were snapshotted on 2026-11-03 - run `swarmy models check` to compare against live prices.
# OpenRouter responses report the real charge, which is what gets logged; these prices are
# used for the per-call budget guard.
#
# Fields:
#   provider          anthropic | openrouter | mock
#   model             provider's model id
#   price             input / output / cache_read / cache_write (+ optional long-context tier)
#   max_concurrency   simultaneous requests to this model across the whole sweep
#   rpm               client-side requests-per-minute limit (use for :free models)
#   refusal_fallback  Anthropic only: send `fallbacks: "default"` so a safety refusal is
#                     re-run on a fallback model. Fallback calls are flagged in the log.
#   thinking          Anthropic only: adaptive | omit
#   effort_levels     which effort values the model accepts (others are mapped down)

models:
  # ---------------- Anthropic (direct API) ----------------
  opus:
    provider: anthropic
    model: claude-opus-5-5
    price: {input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00}
    max_concurrency: 6
    refusal_fallback: true

  sonnet:
    provider: anthropic
    model: claude-sonnet-5-5
    price: {input: 2.00, output: 10.00, cache_read: 0.20, cache_write: 2.50}
    max_concurrency: 8
    refusal_fallback: true

  haiku:
    provider: anthropic
    model: claude-haiku-5-5
    # $0.10/$0.50 for prompts up to 100K tokens, $0.50/$2.50 beyond.
    # Cache prices assume the standard 0.1x read / 1.25x write multipliers - verify on the pricing page.
    price:
      input: 0.10
      output: 0.50
      cache_read: 0.01
      cache_write: 0.125
      long_context_threshold: 100000
      long_input: 0.50
      long_output: 2.50
    max_concurrency: 12

  # ---------------- OpenRouter: free (rate-limited) ----------------
  # Free variants are rate-limited (roughly 20 req/min plus a daily cap that depends on
  # your account's credit balance - see OpenRouter's docs). Fine for smoke tests, but a
  # real sweep will hit the daily cap; use the cheap paid models below for sweeps.
  # Free endpoints may log prompts. Don't send anything sensitive.
  gemma-free:
    provider: openrouter
    model: google/gemma-4-31b-it:free
    price: {input: 0, output: 0}
    max_concurrency: 2
    rpm: 16

  nemotron-free:
    provider: openrouter
    model: nvidia/nemotron-3.5-lightning:free
    price: {input: 0, output: 0}
    max_concurrency: 2
    rpm: 16

  # ---------------- OpenRouter: cheap paid (tool-capable) ----------------
  gpt-oss-120b:
    provider: openrouter
    model: openai/gpt-oss-120b
    price: {input: 0.025, output: 0.092}
    max_concurrency: 16

  qwen-flash:
    provider: openrouter
    model: qwen/qwen3.7-flash
    price: {input: 0.03, output: 0.13}
    max_concurrency: 16

  deepseek-flash:
    provider: openrouter
    model: deepseek/deepseek-v4.1-flash
    price: {input: 0.045, output: 0.50}
    max_concurrency: 16

  # Claude through OpenRouter, for anyone who only has an OpenRouter key.
  haiku-or:
    provider: openrouter
    model: anthropic/claude-haiku-5.5
    price: {input: 0.10, output: 0.50}
    max_concurrency: 8

  # ---------------- Offline ----------------
  mock:
    provider: mock
    model: mock
    price: {input: 0, output: 0}
