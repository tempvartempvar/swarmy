# Same shape as regiment, but each company keeps a shared notebook (wiki) and
# musketeers in the same company can message each other.
name: regiment-mess
description: regiment with company notebooks and messaging between comrades
levels:
  - role: colonel
    model: sonnet
    effort: low
    span: 2
  - role: capitaine
    model: haiku
    span: 3
  - role: mousquetaire
    model: gpt-oss-120b
knowledge:
  wikis:
    - {name: carnet, scope: team, description: "The company's shared notebook."}
communication:
  peers: true
  modes: [message]
