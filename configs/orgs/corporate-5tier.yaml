# The full corporate ladder: 31 agents, 16 workers.
# Expensive: an Opus max-effort CEO plus two Opus C-suite execs can cost $1-4 per run.
# Try it with `orgbench run --org configs/orgs/corporate-5tier.yaml --task mixed --budget 3`.
name: corporate-5tier
description: Opus CEO (max) -> Opus C-suite (medium) -> Sonnet directors -> Haiku managers -> free workers
levels:
  - role: ceo
    model: opus
    effort: max
    span: 2
  - role: c-suite
    model: opus
    effort: medium
    span: 2
  - role: director
    model: sonnet
    effort: medium
    span: 2
  - role: manager
    model: haiku
    span: 2
  - role: worker
    model: gemma-free     # rate-limited; swap with --model worker=gpt-oss-120b for real sweeps
communication: tree
