# A cheap, all-OpenRouter squad built for the greenhouse exercise (one OPENROUTER_API_KEY is all
# you need). Every model here has providers that satisfy a Zero Data Retention account setting. Typical cost of one greenhouse run: a few cents to ~$0.30.
#   swarmy run --org configs/orgs/openrouter-squad.yaml --task greenhouse --budget 1
#   swarmy orders            # how the work was planned and handed out
name: openrouter-squad
description: Cheap, all-OpenRouter - Claude Haiku field marshal; DeepSeek and GLM captains; gpt-oss and GLM soldiers
tree:
  role: field-marshal
  model: haiku-or
  effort: medium
  goal: Ship a controller that passes every acceptance criterion, backed by a simulator you trust, within budget.
  children:
    - role: captain
      name: research-captain
      model: deepseek-flash
      goal: >-
        Every number the engineers need is found, checked against the Zone 3 layout (not other zones,
        future plans or superseded notes) and written to the orders wiki.
      children:
        - {role: scout, model: gpt-oss-120b}
        - {role: scout, model: glm-flash}
    - role: captain
      name: engineering-captain
      model: deepseek-flash
      goal: sim.py implements the documented physics exactly; controller.py is simple, readable and tunable.
      children:
        - {role: sapper, model: gpt-oss-120b}
        - {role: sapper, model: glm-flash}
    - role: captain
      name: test-captain
      model: glm-flash
      goal: >-
        Nothing is reported done until run_tests passes every criterion. Send failures back to
        engineering with the numbers, and keep TEST_REPORT.md up to date.
      children:
        - {role: tester, model: gpt-oss-120b}
knowledge:
  wikis:
    - name: orders
      scope: org
      description: Facts, plans and interfaces everyone relies on. Researched numbers go here.
    - name: unit-log
      scope: team
      description: Each unit's working notes.
communication:
  chain: true
  peers: true
  cross_team: true      # captains coordinate directly; testers and sappers can talk to each other
  skip_up: 1
  cc_skipped: true
  modes: [ask, message]
  max_messages: 10
manager_max_turns: 16
worker_max_turns: 30
