# Same shape as two-tier, but each team shares a wiki and teammates can message each other.
name: two-tier-board
description: two-tier with team wikis and teammate messaging
levels:
  - role: lead
    model: sonnet
    effort: low
    span: 2
  - role: manager
    model: haiku
    span: 3
  - role: worker
    model: gpt-oss-120b
knowledge:
  wikis:
    - {name: team-notes, scope: team}
communication:
  peers: true
  modes: [message]
